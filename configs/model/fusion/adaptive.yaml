# DiagnosisAdaptiveFusion config.
#
# Fusion is indexed by MODALITY, not by vision model. The previous config said
# num_modalities: 5 over [dermlip, panderm, swin_clinical, swin_dermo, resnet152]
# while the evidence layer produced a 4-element modality mask - the mismatch that
# made fusion raise on every real case. See docs/evaluation_integrity.md 3.1.

name: adaptive
num_modalities: 4          # must equal len(src.constants.MODALITIES)
modalities: [clinical_image, dermoscopy_image, metadata, text]
d_common: 256
max_iterations: 3
convergence_threshold: 0.05

# Prediction source. "specialists" pools the trained unimodal heads (A/B/C) with
# a weighted log-opinion pool. "classifier" uses this module's own linear head,
# which is untrained until someone trains it.
prediction_source: specialists

# false => closed-form log(Q*R*U) weighting; see base.yaml.
use_learned_weighting: false

loss:
  type: focal
  gamma: 2.0
  class_weights: auto      # N / (n_classes * n_c)
