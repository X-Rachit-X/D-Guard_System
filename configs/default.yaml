# Lightweight defaults for scripts that take --config but do not need the full
# Hydra tree. The authoritative values live in configs/base.yaml.

seed: 42
num_classes: 6             # PAD-UFES-20; was 2 (binary) which matched nothing
class_names: [BCC, ACK, NEV, SEK, SCC, MEL]
image_size: 224
max_text_length: 128       # matches the tokenizer truncation used in training

# Patient-level, disjoint. proj.md rule 12.
split:
  strategy: patient_level
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

batch_size: 32
epochs: 50
lr: 1.0e-04
weight_decay: 1.0e-05
early_stopping_patience: 10
early_stopping_monitor: val_macro_f1
gradient_clip: 1.0
modality_dropout: 0.3
focal_loss_gamma: 2.0
ptis_low_threshold: 0.3
ptis_high_threshold: 0.7
fp16: true

llm:
  provider: 'ollama'
  base_url: 'http://localhost:11434'
  model: 'qwen2.5:7b'
  timeout: 30
  max_retries: 2
  temperature: 0.0
